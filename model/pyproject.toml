[project]
name = "sitesentinel-model"
version = "0.1.0"
description = "Exploratory analysis of NOAA storm events vs. OSHA severe injury reports for SiteSentinel"
readme = "modelreadme.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.5.6",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
