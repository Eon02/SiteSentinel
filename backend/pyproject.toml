[project]
name = "sitesentinel-backend"
version = "0.1.0"
description = "FastAPI backend for SiteSentinel (PlanIT Control) job-site hazard monitoring"
readme = "backendreadme.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.3",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
